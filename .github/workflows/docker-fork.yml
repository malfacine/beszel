
name: Build Beszel Fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: beszel
            dockerfile: ./internal/dockerfile_hub
            tag: latest

          - name: beszel-agent
            dockerfile: ./internal/dockerfile_agent
            tag: latest

          - name: beszel-agent
            dockerfile: ./internal/dockerfile_agent_alpine
            tag: alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save --cwd ./internal/site

      - name: Build frontend
        run: bun run --cwd ./internal/site build

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/malfacine/beszel/${{ matrix.name }}:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
